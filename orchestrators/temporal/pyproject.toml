[project]
name = "temporal-orchestrator"
version = "0.1.0"
description = "Temporal Saga orchestrator for distributed travel booking"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
