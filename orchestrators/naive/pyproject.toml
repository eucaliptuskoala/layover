[project]
name = "layover-naive"
version = "0.1.0"
description = "Volatile, single-attempt Saga baseline for travel bookings"
requires-python = ">=3.11"
dependencies = [
    'httpx>=0.27.0',
    'pydantic>=2.8.0',
    'fastapi>=0.110.0',
    'uvicorn>=0.28.0',
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["layover_naive"]
package-dir = { layover_naive = "." }
include-package-data = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
