<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Layover — Opening checkout</title>
<meta http-equiv="refresh" content="0;url=checkout.html" />
<style>
  :root{--canvas:#F8FAF8;--ink:#0F172A;--muted:#475569;--emerald:#15803D;--line:#E2E8E2}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;background:var(--canvas);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  main{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px;text-align:center}
  .mark{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;letter-spacing:.3em}
  .mark svg{width:22px;height:22px;color:var(--emerald)}
  p{margin:0;font-size:12px;color:var(--muted)}
  a{font-size:12px;font-weight:700;color:var(--emerald);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px}
  a:hover{border-color:var(--emerald)}
</style>
<script>location.replace('checkout.html');</script>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.5 2.5 3 9.1l6.6 2.4 2.4 6.6z"/></svg>
    LAYOVER
  </div>
  <p>Opening your boutique checkout…</p>
  <a href="checkout.html">Continue to checkout →</a>
</main>
</body>
</html>
