global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'layover-services'
    static_configs:
      - targets:
          - 'gateway:8000'
          - 'flight-service:8001'
          - 'hotel-service:8002'
          - 'payment-service:8003'
          - 'naive-orchestrator:8004'
          - 'temporal-worker:8005'

  - job_name: 'temporal-server'
    static_configs:
      - targets:
          - 'temporal:9091'
