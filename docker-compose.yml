services:
  flight-service:
    build:
      context: ./services/flight
      dockerfile: Dockerfile
    container_name: layover-flight
    ports:
      - "8001:8001"
    environment:
      - FLIGHT_DB_PATH=/app/data/flight.db
    volumes:
      - flight-data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  hotel-service:
    build:
      context: ./services/hotel
      dockerfile: Dockerfile
    container_name: layover-hotel
    ports:
      - "8002:8002"
    environment:
      - HOTEL_DB_PATH=/app/data/hotel.db
    volumes:
      - hotel-data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    container_name: layover-payment
    ports:
      - "8003:8003"
    environment:
      - PAYMENT_DB_PATH=/app/data/payment.db
    volumes:
      - payment-data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  temporal:
    image: temporalio/temporal:latest
    container_name: layover-temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "layover"]
    restart: unless-stopped

  temporal-worker:
    build:
      context: ./orchestrators/temporal
      dockerfile: Dockerfile
    container_name: layover-worker
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=layover
      - TEMPORAL_TASK_QUEUE=booking-task-queue
      - FLIGHT_SERVICE_URL=http://flight-service:8001
      - HOTEL_SERVICE_URL=http://hotel-service:8002
      - PAYMENT_SERVICE_URL=http://payment-service:8003
    depends_on:
      temporal:
        condition: service_started
      flight-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    restart: unless-stopped

  naive-orchestrator:
    build:
      context: ./orchestrators/naive
      dockerfile: Dockerfile
    container_name: layover-naive
    ports:
      - "8004:8004"
    environment:
      - FLIGHT_SERVICE_URL=http://flight-service:8001
      - HOTEL_SERVICE_URL=http://hotel-service:8002
      - PAYMENT_SERVICE_URL=http://payment-service:8003
    depends_on:
      flight-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: layover-gateway
    ports:
      - "8000:8000"
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=layover
      - TEMPORAL_TASK_QUEUE=booking-task-queue
      - TEMPORAL_WEB_UI=http://localhost:8233
      - FLIGHT_SERVICE_URL=http://flight-service:8001
      - HOTEL_SERVICE_URL=http://hotel-service:8002
      - PAYMENT_SERVICE_URL=http://payment-service:8003
      - NAIVE_ORCHESTRATOR_URL=http://naive-orchestrator:8004
    depends_on:
      temporal:
        condition: service_started
      flight-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      naive-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  flight-data:
    name: layover-flight-data
  hotel-data:
    name: layover-hotel-data
  payment-data:
    name: layover-payment-data
