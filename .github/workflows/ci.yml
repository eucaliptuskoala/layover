name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-backend:
    name: Backend (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: flight
            dir: services/flight
            image: flight-service
          - name: hotel
            dir: services/hotel
            image: hotel-service
          - name: payment
            dir: services/payment
            image: payment-service
          - name: gateway
            dir: gateway
            image: layover-gateway
          - name: naive
            dir: orchestrators/naive
            image: layover-naive
          - name: temporal
            dir: orchestrators/temporal
            image: layover-worker

    defaults:
      run:
        working-directory: ${{ matrix.target.dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run Ruff Lint Check
        run: uvx ruff check .

      - name: Install dependencies
        run: uv sync

      - name: Run Pytest Suite
        run: uv run pytest -v

      - name: Build Docker image
        run: docker build -t ${{ matrix.target.image }}:latest .

  verify-frontend:
    name: Frontend (ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint Check
        run: npm run lint

      - name: Run Vitest Suite
        run: npm test -- --run

      - name: Build Production Bundle
        run: npm run build
